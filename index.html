<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marclan Corporate Dashboard</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f1420; overflow:hidden; }
  #app { border:0; width:100%; height:100%; display:block; }
  #boot {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; background:#0f1420; color:#c9d3e6;
    font-family:'DM Sans',system-ui,-apple-system,sans-serif; z-index:2; transition:opacity .4s;
  }
  #boot.hide { opacity:0; pointer-events:none; }
  .spin {
    width:34px; height:34px; border:3px solid rgba(255,255,255,.15);
    border-top-color:#6d7cff; border-radius:50%; animation:sp 1s linear infinite;
  }
  @keyframes sp { to { transform:rotate(360deg); } }
  #boot small { font-size:13px; letter-spacing:.06em; opacity:.7; }
</style>
</head>
<body>

<div id="boot"><div class="spin"></div><small>Memuat dashboard…</small></div>

<!-- ═══════════════════════════════════════════════════════════════════════
     ISI URL APLIKASI DI BAWAH INI (baris APP_URL).
     Ambil dari Apps Script → Deploy → Manage deployments → Web app URL.
     WAJIB menyertakan bagian ?corporate=... di belakangnya.
     Contoh bentuknya:
     https://script.google.com/macros/s/AKfycb.....xyz/exec?corporate=XXXXX
     ═══════════════════════════════════════════════════════════════════════ -->
<iframe id="app"
        title="Marclan Corporate Dashboard"
        allow="clipboard-read; clipboard-write; fullscreen"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
(function(){
  "use strict";

  // ══ ISI DI SINI ══
  var APP_URL = "https://script.google.com/macros/s/AKfycbz58PcPFi5JIsKSM-SKZZHRcKQnsclximFL5fGIS_v6DDzpCYa1iNGt-4Rq1Wgt-hkeqw/exec?corporate=M4rcl4n12345";

  var STORAGE_KEY = 'marclan_corp_token';
  var frame = document.getElementById('app');
  var boot  = document.getElementById('boot');

  if (APP_URL.indexOf('PASTE_URL') === 0) {
    boot.innerHTML = '<div style="max-width:460px;text-align:center;line-height:1.6;padding:24px">'
      + '<b style="font-size:16px">URL aplikasi belum diisi</b><br>'
      + '<span style="font-size:13px;opacity:.8">Buka file ini, cari baris '
      + '<code>APP_URL</code>, lalu isi dengan Web App URL Apps Script '
      + '(lengkap dengan <code>?corporate=...</code>).</span></div>';
    return;
  }

  frame.src = APP_URL;
  frame.addEventListener('load', function(){ boot.classList.add('hide'); });
  setTimeout(function(){ boot.classList.add('hide'); }, 8000);

  /* ═══════════════════════════════════════════════════════════════════════
     JEMBATAN SESI LOGIN

     Dashboard berjalan di dalam iframe (domain Google). Safari di Mac & iPhone
     MEMBLOKIR penyimpanan milik situs pihak ketiga, sehingga dashboard tidak
     bisa menyimpan sesi login-nya sendiri — akibatnya pengguna diminta login
     terus-menerus, atau gagal masuk sama sekali.

     Halaman ini berada di domain perusahaan, jadi penyimpanannya berstatus
     pihak pertama dan TIDAK diblokir browser mana pun. Karena itu halaman ini
     yang menyimpan sesinya, lalu mengirimkannya ke dashboard saat dibuka.

     Token hanya dikirim ke frame yang memintanya (ev.source), tidak disebar.
     ═══════════════════════════════════════════════════════════════════════ */
  window.addEventListener('message', function(ev){
    var d = (ev && ev.data) || {};
    if (!d || !d.type) return;

    if (d.type === 'marclan-token-request') {
      var t = '';
      try { t = localStorage.getItem(STORAGE_KEY) || ''; } catch(e){}
      try { ev.source.postMessage({ type:'marclan-token-restore', token:t }, '*'); } catch(e){}

    } else if (d.type === 'marclan-token-set') {
      try { localStorage.setItem(STORAGE_KEY, d.token || ''); } catch(e){}

    } else if (d.type === 'marclan-token-clear') {
      try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
    }
  });
})();
</script>
</body>
</html>
