<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Tidak Ditemukan — Marclan</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'DM Sans', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: #0f1420; color: #c9d3e6; text-align: center;
  }
  .box { padding: 32px 24px; max-width: 460px; }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: 4px; color: #fff; margin-bottom: 4px; }
  .sub { font-size: 11px; letter-spacing: 3px; color: #6d7cff; margin-bottom: 28px; }
  .code { font-size: 64px; font-weight: 800; color: #6d7cff; line-height: 1; margin: 0; }
  h1 { font-size: 18px; margin: 12px 0 8px; color: #fff; }
  p { font-size: 14px; line-height: 1.6; opacity: .8; margin: 0 0 24px; }
  a.btn {
    display: inline-block; text-decoration: none;
    background: #4318FF; color: #fff; font-weight: 700; font-size: 14px;
    padding: 12px 28px; border-radius: 10px; transition: background .2s;
  }
  a.btn:hover { background: #3712cc; }
  .count { font-size: 12px; opacity: .55; margin-top: 18px; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">MARCLAN</div>
    <div class="sub">INTERNATIONAL</div>

    <p class="code">404</p>
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat yang Anda tuju tidak ada. Anda akan diarahkan kembali ke
       halaman utama dalam <span id="n">5</span> detik.</p>

    <a class="btn" href="./">Kembali ke Dashboard</a>

    <div class="count">Marclan Corporate Dashboard</div>
  </div>

<script>
  // Hitung mundur lalu kembali ke halaman utama (index.html) di folder yang sama.
  var n = 5;
  var el = document.getElementById('n');
  var timer = setInterval(function () {
    n--;
    if (el) el.textContent = n;
    if (n <= 0) { clearInterval(timer); window.location.href = './'; }
  }, 1000);
</script>
</body>
</html>
